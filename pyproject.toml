[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-frontdesk"
version = "0.1.0"
description = "AI Frontdesk modular backend — Phase 1 foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "tzdata>=2025.1,<2028",
  "alembic>=1.14,<2",
  "redis>=5.2,<7",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "twilio>=9,<10",
  "google-genai>=2.29,<3",
  "httpx>=0.28,<1",
  "websockets>=15,<17",
  "lingua-language-detector>=2.1,<3",
  "pgvector>=0.4,<1",
  "boto3>=1.36,<2",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
knowledge = [
    "docling>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "httpx>=0.28,<1",
  # The Starlette test client is built on httpx2.
  "httpx2>=2.13,<3",
  "ruff>=0.11,<1",
  "pyright>=1.1.396,<2",
  "pre-commit>=4.1,<5",
  "pyyaml>=6,<7",
  "boto3-stubs[s3]>=1.43,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "migrations", "tests", "pyproject.toml", "uv.lock", "alembic.ini", "README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pyright]
include = ["app", "migrations", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: requires real PostgreSQL and Redis (RUN_INTEGRATION=true)"]
