name: ai-frontdesk

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
  DEPENDENCY_TIMEOUT_SECONDS: ${DEPENDENCY_TIMEOUT_SECONDS:-2}
  TENANT_AUTH_PUBLIC_ORIGIN: ${TENANT_AUTH_PUBLIC_ORIGIN:-}
  # Injected by the deployment secret manager; never stored in PostgreSQL or its backups.
  SECRET_ENCRYPTION_KEYS: ${SECRET_ENCRYPTION_KEYS:-}
  SECRET_ENCRYPTION_ACTIVE_KEY: ${SECRET_ENCRYPTION_ACTIVE_KEY:-}
  STREAM_TOKEN_KEY: ${STREAM_TOKEN_KEY:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  KNOWLEDGE_STORAGE_BACKEND: ${KNOWLEDGE_STORAGE_BACKEND:-local}
  KNOWLEDGE_LOCAL_PATH: /srv/app/data/knowledge
  KNOWLEDGE_S3_BUCKET: ${KNOWLEDGE_S3_BUCKET:-}
  KNOWLEDGE_S3_REGION: ${KNOWLEDGE_S3_REGION:-}
  KNOWLEDGE_S3_ENDPOINT: ${KNOWLEDGE_S3_ENDPOINT:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

services:
  api:
    build:
      context: .
      target: runtime
    image: ai-frontdesk:local
    pull_policy: build
    environment:
      <<: *app-environment
      TELEPHONY_PUBLIC_BASE_URL: ${TELEPHONY_PUBLIC_BASE_URL:-}
      SAFETY_SEMANTIC_ENABLED: ${SAFETY_SEMANTIC_ENABLED:-true}
    volumes:
      - knowledge-objects:/srv/app/data/knowledge
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  setup:
    build:
      context: .
      target: runtime
    image: ai-frontdesk:local
    pull_policy: build
    environment:
      <<: *app-environment
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL to the schema owner connection}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Set WORKER_DATABASE_URL to a separate restricted worker login}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
    command: ["python", "-m", "app.setup"]
    healthcheck:
      disable: true
    restart: "no"

  # The single background process: notifications, post-call jobs, email, knowledge
  # ingestion and configuration events. It holds the worker login only.
  worker:
    build:
      context: .
      target: worker
    image: ai-frontdesk-worker:local
    pull_policy: build
    environment:
      <<: *app-environment
      DATABASE_URL: ${WORKER_DATABASE_URL:?Set WORKER_DATABASE_URL to a separate restricted worker login}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Set WORKER_DATABASE_URL to a separate restricted worker login}
      HF_HOME: /srv/app/data/models
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - knowledge-objects:/srv/app/data/knowledge
      - knowledge-models:/srv/app/data/models
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 75s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Development mail: in Platform settings, Email, use host mailpit, port 1025 and
  # "No encryption", then read every message at http://localhost:8025. Nothing leaves
  # this machine.
  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  redis:
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  knowledge-objects:
  knowledge-models:
